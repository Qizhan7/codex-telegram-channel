[project]
name = "codex-telegram-channel"
version = "0.1.0"
description = "Standalone Telegram bridge for talking to Codex."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
tokens = ["tiktoken>=0.9"]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["scripts"]
